<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KU Loket - Exam Results</title>
    <script>
        // Read ?sap-language=xx from URL and inject into bootstrap before UI5 loads
        (function () {
            var lang = new URLSearchParams(window.location.search).get('sap-language') || 'nl';
            document.write('<script src="https://ui5.sap.com/resources/sap-ui-core.js"' +
                ' id="sap-ui-bootstrap"' +
                ' data-sap-ui-theme="sap_horizon"' +
                ' data-sap-ui-libs="sap.ui.integration,sap.ui.core,sap.m"' +
                ' data-sap-ui-async="true"' +
                ' data-sap-ui-language="' + lang + '"' +
                ' data-sap-ui-compatVersion="edge"><\/script>');
        })();
    </script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Top bar ── */
        .topbar {
            background-color: #003B5C;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            height: 56px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar-brand svg {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
        }

        .topbar-title {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        /* ── Language switcher ── */
        .lang-switcher {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .lang-btn {
            background: transparent;
            border: 1.5px solid rgba(255,255,255,0.5);
            color: rgba(255,255,255,0.8);
            border-radius: 4px;
            padding: 4px 12px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
            letter-spacing: 0.5px;
        }

        .lang-btn:hover {
            background: rgba(255,255,255,0.12);
            border-color: white;
            color: white;
        }

        .lang-btn.active {
            background: white;
            border-color: white;
            color: #003B5C;
            font-weight: 700;
        }

        /* ── Page content ── */
        .page-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 24px;
        }

        .card-wrapper {
            width: 100%;
            max-width: 900px;
        }

        /* ── Legend ── */
        .legend {
            display: flex;
            gap: 20px;
            margin-top: 14px;
            font-size: 12px;
            color: #555;
            padding-left: 4px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .dot-success { background-color: #107E3E; }
        .dot-warning { background-color: #E9730C; }
        .dot-error   { background-color: #BB0000; }
    </style>
</head>
<body>

    <header class="topbar">
        <div class="topbar-brand">
            <!-- KU Leuven–style shield icon -->
            <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M18 2L4 8v10c0 8.5 6 16 14 18 8-2 14-9.5 14-18V8L18 2z" fill="#005F8E"/>
                <path d="M18 6L7 11v8c0 6.5 4.5 12.3 11 14 6.5-1.7 11-7.5 11-14v-8L18 6z" fill="#003B5C"/>
                <text x="18" y="24" text-anchor="middle" fill="white" font-size="13" font-weight="bold" font-family="serif">K</text>
            </svg>
            <span class="topbar-title">KU Loket</span>
        </div>

        <nav class="lang-switcher" aria-label="Language selection">
            <button class="lang-btn" id="btn-nl" onclick="switchLang('nl')" aria-label="Dutch">NL</button>
            <button class="lang-btn" id="btn-en" onclick="switchLang('en')" aria-label="English">EN</button>
        </nav>
    </header>

    <main class="page-content">
        <div class="card-wrapper">
            <div id="cardContainer"></div>
            <div class="legend">
                <div class="legend-item"><span class="legend-dot dot-success"></span> ≥ 12/20</div>
                <div class="legend-item"><span class="legend-dot dot-warning"></span> 10–11/20</div>
                <div class="legend-item"><span class="legend-dot dot-error"></span> &lt; 10/20</div>
            </div>
        </div>
    </main>

    <script>
        // Mark the active language button on load
        (function () {
            var lang = new URLSearchParams(window.location.search).get('sap-language') || 'nl';
            var btn = document.getElementById('btn-' + lang);
            if (btn) btn.classList.add('active');
        })();

        function switchLang(lang) {
            var url = new URL(window.location.href);
            url.searchParams.set('sap-language', lang);
            window.location.href = url.toString();
        }

        sap.ui.require(["sap/ui/integration/widgets/Card"], function (Card) {
            var oCard = new Card({
                manifest: "./cards/manifest.json",
                width: "100%"
            });
            oCard.placeAt("cardContainer");
        });
    </script>

</body>
</html>
